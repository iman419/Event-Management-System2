
<section id="dashboard">
    <h1>Dashboard</h1>
    <p class="text-secondary">A summary of your event activity.</p>

    <div class="row g-3 mt-2">
        <div class="col-md-4">
            <div class="card h-100">
                <div class="card-body">
                    <h2 class="h5">Upcoming Events</h2>
                    <p>Explore events you may want to attend.</p>
                    <button class="btn btn-outline-primary" data-view="events">
                        Browse Events
                    </button>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card h-100">
                <div class="card-body">
                    <h2 class="h5">My Registrations</h2>
                    <p>Review your event registrations.</p>
                    <button class="btn btn-outline-primary" data-view="registrations">
                        View Registrations
                    </button>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card h-100">
                <div class="card-body">
                    <h2 class="h5">My Profile</h2>
                    <p>View your profile information.</p>
                    <button class="btn btn-outline-primary" data-view="profile">
                        Open Profile
                    </button>
                </div>
            </div>
        </div>
    </div>

    <p class="small text-secondary mt-3">
        Dashboard data is illustrative only; no user account is connected.
    </p>
</section>
